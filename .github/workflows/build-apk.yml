name: Build Leotube APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: جلب ملفات المشروع
        uses: actions/checkout@v4

      - name: إعداد بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: إعداد بيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: الموافقة التلقائية على تراخيص Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: تثبيت أدوات بناء أندرويد (Bubblewrap)
        run: npm install -g @bubblewrap/cli

      - name: تهيئة مسارات Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"${JAVA_HOME}\",\"androidSdkPath\":\"${ANDROID_HOME}\"}" > ~/.bubblewrap/config.json

      - name: إنشاء ملف twa-manifest.json
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.leotube.app",
            "host": "khalidalbarqi20.github.io",
            "name": "Leotube",
            "launcherName": "Leotube",
            "display": "standalone",
            "themeColor": "#0b0c0f",
            "navigationColor": "#0b0c0f",
            "backgroundColor": "#0b0c0f",
            "enableNotifications": false,
            "startUrl": "/Leotube/",
            "iconUrl": "https://khalidalbarqi20.github.io/Leotube/icon-512.png",
            "maskableIconUrl": "https://khalidalbarqi20.github.io/Leotube/icon-maskable-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://khalidalbarqi20.github.io/Leotube/manifest.json",
            "fallbackType": "customtabs",
            "features": {}
          }
          EOF

      - name: إنشاء مفتاح توقيع رقمي (Keystore)
        run: |
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass "android123" -keypass "android123" -dname "CN=Leotube,O=Leotube,C=SA"

      - name: تحويل المشروع إلى تطبيق أندرويد
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: android123
          BUBBLEWRAP_KEY_PASSWORD: android123
        run: |
          bubblewrap build --manifest=twa-manifest.json --skipPwaValidation

      - name: حفظ ورفع ملف التطبيق النهائي (APK & AAB)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Leotube-Android-App
          path: |
            *.apk
            *.aab
