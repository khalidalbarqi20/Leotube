<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leotube</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0b0c0f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="shortcut icon" href="favicon.png">
<style>
  :root{
    --bg:#0b0c0f;
    --panel:#15171c;
    --line:#23262d;
    --text:#eceef1;
    --muted:#8a8f98;
    --accent:#e2b13c;
    --accent-dim:#4a3d1a;
    --radius:14px;
  }
  body.theme-light{
    --bg:#f4f5f7;
    --panel:#ffffff;
    --line:#e2e4e9;
    --text:#15171c;
    --muted:#6b7078;
    --accent:#b9791a;
    --accent-dim:#f2e2c2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    height:100%; overflow-x:hidden;}
  body{display:flex; flex-direction:column;}

  /* Header */
  header{
    position:sticky; top:0; z-index:20;
    background:rgba(11,12,15,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:10px 14px;
  }
  .search-wrap{position:relative;}
  .suggest-box{
    position:absolute; top:calc(100% + 6px); right:0; left:0;
    background:var(--panel); border:1px solid var(--line);
    border-radius:12px; overflow:hidden; z-index:30;
    max-height:70vh; overflow-y:auto;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    display:none;
  }
  .suggest-box.open{display:block;}
  .suggest-row{
    display:flex; gap:10px; align-items:center;
    padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--line);
  }
  .suggest-row:last-child{border-bottom:none;}
  .suggest-row:active{background:#1c1f26;}
  .suggest-thumb{
    width:56px; min-width:56px; aspect-ratio:16/9; border-radius:6px;
    overflow:hidden; background:#000;
  }
  .suggest-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .suggest-text{min-width:0;}
  .suggest-text .st-title{
    font-size:13px; font-weight:600; line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .suggest-text .st-channel{font-size:11.5px; color:var(--muted); margin-top:3px;}
  .suggest-loading{padding:12px; text-align:center; color:var(--muted); font-size:13px;}
  .suggest-recent-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; font-size:12px; color:var(--muted);
    border-bottom:1px solid var(--line);
  }
  .suggest-recent-header .clear-all{color:var(--accent); cursor:pointer;}
  .recent-row .recent-icon{font-size:15px; opacity:0.6; width:20px; text-align:center;}
  .recent-row .recent-remove{
    padding:6px 8px; color:var(--muted); font-size:13px; cursor:pointer;
  }
  .brand{
    display:flex; align-items:center; gap:8px; margin-bottom:10px;
  }
  .brand-mark{
    width:26px; height:26px; border-radius:7px;
    background:linear-gradient(135deg,var(--accent),#8a6a12);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:14px; color:#0b0c0f;
  }
  .brand-name{font-weight:700; font-size:17px; letter-spacing:0.2px;}
  .brand-name span{color:var(--accent);}
  .header-actions{margin-right:auto; display:flex; align-items:center; gap:10px;}
  .version-tag{font-size:11px; color:var(--muted);}
  .icon-btn{
    background:none; border:none; color:var(--muted); cursor:pointer;
    padding:4px; display:flex; align-items:center; justify-content:center;
  }

  /* Settings overlay */
  #settings-overlay{
    position:fixed; inset:0; background:var(--bg); z-index:110;
    display:none; flex-direction:column; overflow-y:auto;
  }
  #settings-overlay.open{display:flex;}
  .settings-top{
    display:flex; align-items:center; gap:12px;
    padding:14px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--bg);
  }
  .settings-top h2{font-size:16px; margin:0; flex:1;}
  .settings-body{padding:14px; display:flex; flex-direction:column; gap:22px;}
  .settings-group h3{
    font-size:12.5px; color:var(--muted); margin:0 0 10px; font-weight:600;
    text-transform:uppercase; letter-spacing:0.3px;
  }
  .settings-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:13px 14px; margin-bottom:8px;
  }
  .settings-row .label{font-size:14px; font-weight:500;}
  .settings-row .sub{font-size:12px; color:var(--muted); margin-top:2px;}

  .segmented{
    display:flex; background:var(--bg); border:1px solid var(--line);
    border-radius:999px; padding:3px; gap:2px;
  }
  .segmented button{
    border:none; background:none; color:var(--muted); font-size:13px;
    padding:7px 14px; border-radius:999px; cursor:pointer; font-weight:600;
  }
  .segmented button.active{background:var(--accent); color:#1a1300;}

  select.quality-select{
    background:var(--bg); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit;
  }

  .settings-btn-row{
    width:100%; text-align:center; padding:13px;
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    color:var(--accent); font-size:13.5px; font-weight:600; cursor:pointer;
  }
  .update-status{font-size:12px; color:var(--muted); text-align:center; margin-top:8px;}

  .searchbar{
    display:flex; align-items:center; gap:8px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:999px; padding:9px 14px;
  }
  .searchbar input{
    flex:1; background:transparent; border:none; outline:none;
    color:var(--text); font-size:15px; font-family:inherit;
  }
  .searchbar input::placeholder{color:var(--muted);}
  .searchbar button{
    background:none; border:none; color:var(--muted);
    font-size:18px; cursor:pointer; padding:2px 4px; line-height:1;
  }
  .searchbar button.go{color:var(--accent);}

  /* Content */
  main{flex:1; padding:14px; padding-bottom:40px;}
  .status{
    text-align:center; color:var(--muted); font-size:13.5px;
    padding:30px 10px;
  }
  .status.error{color:#e2725f;}

  .empty-hint{
    text-align:center; color:var(--muted); font-size:13.5px;
    padding:60px 20px; line-height:1.9;
  }
  .empty-hint b{color:var(--text); font-weight:600;}

  .grid{
    display:grid; grid-template-columns:1fr; gap:14px;
  }
  .card{
    background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); overflow:hidden; cursor:pointer;
    transition:border-color 0.15s;
  }
  .card:active{border-color:var(--accent-dim);}
  .thumb-wrap{position:relative; width:100%; aspect-ratio:16/9; background:#000;}
  .thumb-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
  .play-badge{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,0); transition:background 0.15s;
  }
  .play-badge svg{opacity:0; transition:opacity 0.15s;}
  .card:active .play-badge{background:rgba(0,0,0,0.25);}
  .card:active .play-badge svg{opacity:1;}
  .card-body{padding:10px 12px 12px;}
  .card-title{
    font-size:14.5px; font-weight:600; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-meta{
    margin-top:6px; font-size:12.5px; color:var(--muted);
    display:flex; align-items:center; gap:6px;
  }

  .load-more{
    display:block; width:100%; margin-top:6px; padding:13px;
    background:var(--panel); border:1px solid var(--line); border-radius:999px;
    color:var(--accent); font-size:14px; font-weight:600; cursor:pointer;
  }

  /* Player overlay */
  #player-overlay{
    position:fixed; inset:0; background:#000; z-index:100;
    display:none; flex-direction:column; overflow-y:auto;
  }
  #player-overlay.open{display:flex;}
  .player-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 12px; background:#000;
  }
  .close-btn{
    background:var(--panel); border:1px solid var(--line); color:var(--text);
    width:34px; height:34px; border-radius:50%; font-size:16px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .player-frame-wrap{width:100%; aspect-ratio:16/9; background:#000;}
  .player-frame-wrap iframe{width:100%; height:100%; border:none;}
  .player-info{padding:14px; overflow-y:auto; flex:1;}
  .player-info h2{font-size:16px; margin:0 0 8px; line-height:1.4;}
  .player-info .channel{color:var(--muted); font-size:13.5px;}

  .related-section{margin-top:22px;}
  .lazy-actions{display:flex; flex-direction:column; gap:8px; margin-top:18px;}
  .lazy-btn{
    padding:12px; background:var(--panel); border:1px solid var(--line);
    border-radius:999px; color:var(--text); font-size:13.5px; font-weight:600;
    cursor:pointer; text-align:center;
  }
  .lazy-btn:active{border-color:var(--accent-dim);}
  .lazy-btn.loaded{color:var(--muted); border-color:var(--line);}
  .related-section h3{
    font-size:14px; font-weight:700; color:var(--text);
    margin:0 0 12px; padding-right:2px;
  }
  .related-list{display:flex; flex-direction:column; gap:10px;}
  .related-row{
    display:flex; gap:10px; cursor:pointer; border-radius:10px;
  }
  .related-row:active{background:var(--panel);}
  .related-thumb{
    width:120px; min-width:120px; aspect-ratio:16/9; border-radius:8px;
    overflow:hidden; background:#000;
  }
  .related-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .related-text{display:flex; flex-direction:column; justify-content:center; min-width:0;}
  .related-text .rt-title{
    font-size:13px; font-weight:600; line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .related-text .rt-channel{font-size:12px; color:var(--muted); margin-top:4px;}
  .related-loading{color:var(--muted); font-size:13px; padding:6px 2px;}

  ::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">L</div>
    <div class="brand-name">Leo<span>tube</span></div>
    <div class="header-actions">
      <div class="version-tag">v12</div>
      <button class="icon-btn" id="settingsBtn" aria-label="الإعدادات">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 5a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </div>
  <div class="search-wrap">
    <div class="searchbar">
      <button class="go" id="searchBtn" aria-label="بحث">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </button>
      <input id="searchInput" type="text" placeholder="ابحث في يوتيوب..." enterkeyhint="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
      <button id="clearBtn" aria-label="مسح" style="display:none;">✕</button>
    </div>
    <div class="suggest-box" id="suggestBox"></div>
  </div>
</header>

<main>
  <div id="results"></div>
</main>

<div id="player-overlay">
  <div class="player-top">
    <div style="width:34px;"></div>
    <div class="close-btn" id="closePlayer">✕</div>
  </div>
  <div class="player-frame-wrap">
    <div id="playerFrame"></div>
  </div>
  <div class="player-info">
    <h2 id="playerTitle"></h2>
    <div class="channel" id="playerChannel"></div>

    <div class="lazy-actions">
      <button class="lazy-btn" id="loadChannelBtn" data-i18n="moreFromChannel">📺 المزيد من هذي القناة</button>
      <button class="lazy-btn" id="loadSimilarBtn" data-i18n="similarVideosBtn">🔎 فيديوهات مشابهة</button>
    </div>

    <div class="related-section" id="channelSection" style="display:none;">
      <h3 data-i18n="moreFromChannelTitle">المزيد من هذي القناة</h3>
      <div class="related-list" id="channelList"></div>
    </div>

    <div class="related-section" id="similarSection" style="display:none;">
      <h3 data-i18n="similarTitle">فيديوهات مشابهة</h3>
      <div class="related-list" id="similarList"></div>
    </div>
  </div>
</div>

<div id="settings-overlay">
  <div class="settings-top">
    <h2 data-i18n="settingsTitle">الإعدادات</h2>
    <div class="close-btn" id="closeSettings">✕</div>
  </div>
  <div class="settings-body">

    <div class="settings-group">
      <h3 data-i18n="appearance">المظهر</h3>
      <div class="settings-row">
        <div class="label" data-i18n="theme">الوضع</div>
        <div class="segmented" id="themeToggle">
          <button data-value="dark" data-i18n="dark">داكن</button>
          <button data-value="light" data-i18n="light">فاتح</button>
        </div>
      </div>
    </div>

    <div class="settings-group">
      <h3 data-i18n="playback">التشغيل</h3>
      <div class="settings-row">
        <div>
          <div class="label" data-i18n="defaultQuality">الجودة الافتراضية</div>
          <div class="sub" data-i18n="qualityNote">تفضيل، يمكن تغييره داخل كل فيديو</div>
        </div>
        <select class="quality-select" id="qualitySelect">
          <option value="default" data-i18n="qAuto">تلقائي</option>
          <option value="hd1080" data-i18n="q1080">1080p</option>
          <option value="hd720" data-i18n="q720">720p</option>
          <option value="large" data-i18n="q480">480p</option>
          <option value="medium" data-i18n="q360">360p</option>
          <option value="small" data-i18n="q240">240p</option>
        </select>
      </div>
    </div>

    <div class="settings-group">
      <h3 data-i18n="language">اللغة</h3>
      <div class="settings-row">
        <div class="label" data-i18n="appLanguage">لغة التطبيق</div>
        <div class="segmented" id="langToggle">
          <button data-value="ar">العربية</button>
          <button data-value="en">English</button>
        </div>
      </div>
    </div>

    <div class="settings-group">
      <h3 data-i18n="updatesTitle">التحديثات</h3>
      <div class="settings-btn-row" id="checkUpdateBtn" data-i18n="checkUpdate">تحقق من التحديثات</div>
      <div class="update-status" id="updateStatus"></div>
    </div>

    <div class="settings-group">
      <h3 data-i18n="about">معلومات التطبيق</h3>
      <div class="settings-row">
        <div class="label" data-i18n="versionLabel">رقم الإصدار</div>
        <div class="sub" id="aboutVersion">v12</div>
      </div>
    </div>

  </div>
</div>

<script>
/* ============================================================
   Leotube — إعداد مفتاح API
   حط مفتاح YouTube Data API v3 تبعك هنا مباشرة للتجربة بالمتصفح.
   قبل تحويل التطبيق لـ APK ونشره، لازم ننقل هذا المفتاح لـ
   Cloudflare Worker وسيط (نفس أسلوب khalidforfit) عشان ما يكون
   مكشوف بالكود العلني.
   ============================================================ */
/* ============================================================
   Leotube — رابط الووركر الوسيط
   ما فيه أي مفتاح API هنا — الووركر هو اللي يحمل المفتاح الحقيقي
   ويحميه. حط رابط الووركر بعد نشره على Cloudflare.
   ============================================================ */
const API_BASE = "https://leotube-youtube.khalidalbarqi20.workers.dev";
const APP_VERSION = "v12";

/* ============================================================
   الإعدادات — لغة / مظهر / جودة / تحديثات
   ============================================================ */
const STRINGS = {
  ar: {
    searchPlaceholder: "ابحث في يوتيوب...",
    emptyHintLine1: "اكتب أي شي وابحث — <b>أفلام، قنوات، أغاني، أي شي</b>",
    emptyHintLine2: "بدون تسجيل دخول، وبدون حفظ أي بيانات عنك",
    moreFromChannel: "📺 المزيد من هذي القناة",
    similarVideosBtn: "🔎 فيديوهات مشابهة",
    moreFromChannelTitle: "المزيد من هذي القناة",
    similarTitle: "فيديوهات مشابهة",
    settingsTitle: "الإعدادات",
    appearance: "المظهر",
    theme: "الوضع",
    dark: "داكن",
    light: "فاتح",
    playback: "التشغيل",
    defaultQuality: "الجودة الافتراضية",
    qualityNote: "تفضيل، يمكن تغييره داخل كل فيديو",
    qAuto: "تلقائي",
    q1080: "1080p",
    q720: "720p",
    q480: "480p",
    q360: "360p",
    q240: "240p",
    language: "اللغة",
    appLanguage: "لغة التطبيق",
    updatesTitle: "التحديثات",
    checkUpdate: "تحقق من التحديثات",
    about: "معلومات التطبيق",
    versionLabel: "رقم الإصدار",
    upToDate: "أنت على آخر إصدار",
    recentSearches: "عمليات بحث سابقة",
    clearAll: "مسح الكل",
  },
  en: {
    searchPlaceholder: "Search YouTube...",
    emptyHintLine1: "Type anything and search — <b>movies, channels, music, anything</b>",
    emptyHintLine2: "No sign-in, no data stored about you",
    moreFromChannel: "📺 More from this channel",
    similarVideosBtn: "🔎 Similar videos",
    moreFromChannelTitle: "More from this channel",
    similarTitle: "Similar videos",
    settingsTitle: "Settings",
    appearance: "Appearance",
    theme: "Theme",
    dark: "Dark",
    light: "Light",
    playback: "Playback",
    defaultQuality: "Default quality",
    qualityNote: "A preference, changeable inside each video",
    qAuto: "Auto",
    q1080: "1080p",
    q720: "720p",
    q480: "480p",
    q360: "360p",
    q240: "240p",
    language: "Language",
    appLanguage: "App language",
    updatesTitle: "Updates",
    checkUpdate: "Check for updates",
    about: "About",
    versionLabel: "Version",
    upToDate: "You're on the latest version",
    recentSearches: "Recent searches",
    clearAll: "Clear all",
  }
};

function getSetting(key, fallback){
  try{ return localStorage.getItem(key) || fallback; }catch(err){ return fallback; }
}
function setSetting(key, value){
  try{ localStorage.setItem(key, value); }catch(err){}
}

let currentLang = getSetting("leotube_lang", "ar");

function t(key){
  return (STRINGS[currentLang] && STRINGS[currentLang][key]) || STRINGS.ar[key] || key;
}

function applyLanguage(lang){
  currentLang = lang;
  setSetting("leotube_lang", lang);
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    el.innerHTML = t(key);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const key = el.getAttribute("data-i18n-placeholder");
    el.placeholder = t(key);
  });

  document.querySelectorAll("#langToggle button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.value === lang);
  });

  showEmptyHint();
}

function applyTheme(theme){
  document.body.classList.toggle("theme-light", theme === "light");
  setSetting("leotube_theme", theme);
  document.querySelectorAll("#themeToggle button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.value === theme);
  });
}

function getQualityPref(){
  return getSetting("leotube_quality", "default");
}

let nextPageToken = "";
let currentQuery = "";

const resultsEl = document.getElementById("results");
const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const clearBtn = document.getElementById("clearBtn");
const suggestBox = document.getElementById("suggestBox");

function showEmptyHint(){
  resultsEl.innerHTML = `
    <div class="empty-hint">
      ${t("emptyHintLine1")}<br>
      ${t("emptyHintLine2")}
    </div>`;
}
showEmptyHint();

let suggestTimer = null;
let suggestAbortToken = 0;
const RECENT_KEY = "leotube_recent_searches";
const RECENT_MAX = 10;

function getRecentSearches(){
  try{
    return JSON.parse(localStorage.getItem(RECENT_KEY)) || [];
  }catch(err){ return []; }
}

function saveRecentSearch(q){
  let list = getRecentSearches().filter(item => item !== q);
  list.unshift(q);
  list = list.slice(0, RECENT_MAX);
  try{ localStorage.setItem(RECENT_KEY, JSON.stringify(list)); }catch(err){}
}

function removeRecentSearch(q){
  const list = getRecentSearches().filter(item => item !== q);
  try{ localStorage.setItem(RECENT_KEY, JSON.stringify(list)); }catch(err){}
}

function renderRecentSearches(){
  const list = getRecentSearches();
  if(list.length === 0){
    suggestBox.innerHTML = "";
    closeSuggestBox();
    return;
  }
  suggestBox.innerHTML = "";
  const header = document.createElement("div");
  header.className = "suggest-recent-header";
  header.innerHTML = `<span>${t("recentSearches")}</span><span class="clear-all" id="clearAllRecent">${t("clearAll")}</span>`;
  suggestBox.appendChild(header);

  list.forEach(q => {
    const row = document.createElement("div");
    row.className = "suggest-row recent-row";
    row.innerHTML = `
      <div class="recent-icon">🕘</div>
      <div class="suggest-text" style="flex:1;"><div class="st-title">${escapeHtml(q)}</div></div>
      <div class="recent-remove" data-q="${escapeHtml(q)}">✕</div>`;
    row.addEventListener("click", (e) => {
      if(e.target.closest(".recent-remove")) return;
      searchInput.value = q;
      closeSuggestBox();
      runSearch();
    });
    row.querySelector(".recent-remove").addEventListener("click", (e) => {
      e.stopPropagation();
      removeRecentSearch(q);
      renderRecentSearches();
      if(getRecentSearches().length === 0) closeSuggestBox();
    });
    suggestBox.appendChild(row);
  });

  suggestBox.classList.add("open");
  const clearAllBtn = document.getElementById("clearAllRecent");
  if(clearAllBtn){
    clearAllBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      try{ localStorage.removeItem(RECENT_KEY); }catch(err){}
      closeSuggestBox();
    });
  }
}

searchInput.addEventListener("input", () => {
  clearBtn.style.display = searchInput.value ? "block" : "none";
  const q = searchInput.value.trim();

  clearTimeout(suggestTimer);
  if(q.length === 0){
    renderRecentSearches();
    return;
  }
  if(q.length < 3){
    closeSuggestBox();
    return;
  }
  suggestTimer = setTimeout(() => fetchSuggestions(q), 550);
});

searchInput.addEventListener("focus", () => {
  const q = searchInput.value.trim();
  if(q.length === 0){
    renderRecentSearches();
  }else if(suggestBox.innerHTML.trim() && q.length >= 3){
    suggestBox.classList.add("open");
  }
});

document.addEventListener("click", (e) => {
  if(!e.target.closest(".search-wrap")) closeSuggestBox();
});

function closeSuggestBox(){
  suggestBox.classList.remove("open");
}

async function fetchSuggestions(q){
  if(API_BASE === "ضع_رابط_الووركر_هنا") return;
  const myToken = ++suggestAbortToken;
  suggestBox.innerHTML = `<div class="suggest-loading">جاري البحث...</div>`;
  suggestBox.classList.add("open");
  try{
    const url = `${API_BASE}/search?part=snippet&type=video&maxResults=4&q=${encodeURIComponent(q)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(myToken !== suggestAbortToken) return; // نتيجة قديمة، تجاهلها
    if(data.error){
      suggestBox.innerHTML = `<div class="suggest-loading">${apiErrorMessage(data)}</div>`;
      return;
    }
    if(!data.items || data.items.length === 0){
      suggestBox.innerHTML = "";
      closeSuggestBox();
      return;
    }
    renderSuggestions(data.items);
  }catch(err){
    if(myToken !== suggestAbortToken) return;
    suggestBox.innerHTML = `<div class="suggest-loading">تعذر الاتصال، تحقق من الإنترنت</div>`;
  }
}

function renderSuggestions(items){
  suggestBox.innerHTML = "";
  items.forEach(item => {
    const vid = item.id.videoId;
    const sn = item.snippet;
    if(!vid) return;
    const row = document.createElement("div");
    row.className = "suggest-row";
    row.innerHTML = `
      <div class="suggest-thumb"><img loading="lazy" src="${sn.thumbnails.default?.url || sn.thumbnails.medium?.url}" alt=""></div>
      <div class="suggest-text">
        <div class="st-title">${escapeHtml(sn.title)}</div>
        <div class="st-channel">${escapeHtml(sn.channelTitle)}</div>
      </div>`;
    row.addEventListener("click", () => {
      closeSuggestBox();
      searchInput.value = sn.title;
      openPlayer(vid, sn.title, sn.channelTitle, sn.channelId);
    });
    suggestBox.appendChild(row);
  });
  suggestBox.classList.add("open");
}

clearBtn.addEventListener("click", () => {
  searchInput.value = "";
  clearBtn.style.display = "none";
  closeSuggestBox();
  showEmptyHint();
  searchInput.focus();
});
searchBtn.addEventListener("click", () => runSearch());
searchInput.addEventListener("keydown", (e) => {
  if(e.key === "Enter") runSearch();
});

function runSearch(){
  const q = searchInput.value.trim();
  if(!q) return;
  closeSuggestBox();
  saveRecentSearch(q);
  currentQuery = q;
  nextPageToken = "";
  resultsEl.innerHTML = `<div class="status">جاري البحث...</div>`;
  fetchResults(true);
}

async function fetchResults(isNewSearch){
  if(API_BASE === "ضع_رابط_الووركر_هنا"){
    resultsEl.innerHTML = `<div class="status error">لازم تحط رابط الووركر أول بملف leotube.html (متغير API_BASE)</div>`;
    return;
  }
  try{
    const url = `${API_BASE}/search?part=snippet&type=video&maxResults=20&q=${encodeURIComponent(currentQuery)}${nextPageToken ? "&pageToken=" + nextPageToken : ""}`;
    const res = await fetch(url);
    const data = await res.json();

    if(data.error){
      resultsEl.innerHTML = `<div class="status error">${apiErrorMessage(data)}</div>`;
      return;
    }

    nextPageToken = data.nextPageToken || "";

    const items = data.items || [];
    if(isNewSearch){
      resultsEl.innerHTML = `<div class="grid" id="grid"></div>`;
    }
    const grid = document.getElementById("grid");

    items.forEach(item => {
      const vid = item.id.videoId;
      const sn = item.snippet;
      if(!vid) return;
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="thumb-wrap">
          <img loading="lazy" src="${sn.thumbnails.medium?.url || sn.thumbnails.default?.url}" alt="">
          <div class="play-badge">
            <svg width="46" height="46" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          </div>
        </div>
        <div class="card-body">
          <div class="card-title">${escapeHtml(sn.title)}</div>
          <div class="card-meta">${escapeHtml(sn.channelTitle)}</div>
        </div>`;
      card.addEventListener("click", () => openPlayer(vid, sn.title, sn.channelTitle, sn.channelId));
      grid.appendChild(card);
    });

    if(nextPageToken){
      const existingBtn = document.querySelector(".load-more");
      if(existingBtn) existingBtn.remove();
      const btn = document.createElement("div");
      btn.className = "load-more";
      btn.textContent = "تحميل المزيد";
      btn.addEventListener("click", () => {
        btn.textContent = "جاري التحميل...";
        fetchResults(false);
      });
      resultsEl.appendChild(btn);
    }

    if(items.length === 0 && isNewSearch){
      resultsEl.innerHTML = `<div class="status">ما فيه نتائج، جرّب كلمة ثانية</div>`;
    }
  }catch(err){
    resultsEl.innerHTML = `<div class="status error">تعذر الاتصال، تحقق من الإنترنت</div>`;
  }
}

function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}

/* Player — عبر YouTube IFrame API عشان نقدر نطبّق تفضيل الجودة */
const overlay = document.getElementById("player-overlay");
const playerTitle = document.getElementById("playerTitle");
const playerChannel = document.getElementById("playerChannel");
const closePlayer = document.getElementById("closePlayer");

const channelListEl = document.getElementById("channelList");
const similarListEl = document.getElementById("similarList");
const channelSection = document.getElementById("channelSection");
const similarSection = document.getElementById("similarSection");
const loadChannelBtn = document.getElementById("loadChannelBtn");
const loadSimilarBtn = document.getElementById("loadSimilarBtn");

let activeChannelId = null;
let activeVideoId = null;
let activeTitle = null;

let ytPlayer = null;
let ytApiReady = false;
let pendingOpen = null; // {videoId, title, channel, channelId} لو انفتح المشغّل قبل ما يجهز API

// ============================================================
// Screen Wake Lock
// يمنع إطفاء شاشة الهاتف أثناء تشغيل الفيديو في PWA / TWA.
// يتم تفعيله فقط أثناء التشغيل، ويُعاد طلبه بعد العودة للتطبيق
// لأن النظام قد يحرره عند انتقال الصفحة للخلفية.
// ============================================================
let screenWakeLock = null;
let wakeLockWanted = false;

async function requestScreenWakeLock(){
  if(!wakeLockWanted) return;
  if(document.visibilityState !== "visible") return;
  if(!overlay.classList.contains("open")) return;
  if(!('wakeLock' in navigator)) return;

  try{
    // لا نطلب قفلًا جديدًا إذا كان القفل الحالي ما زال فعالًا.
    if(screenWakeLock && !screenWakeLock.released) return;

    screenWakeLock = await navigator.wakeLock.request("screen");

    screenWakeLock.addEventListener("release", () => {
      screenWakeLock = null;
      // إذا كان الفيديو ما زال مطلوبًا، نحاول استعادته عند عودة الصفحة للواجهة.
    });
  }catch(err){
    // قد يرفض النظام الطلب بسبب حالة الطاقة أو قيود المتصفح/TWA.
    console.log("Screen Wake Lock unavailable:", err?.name || err);
    screenWakeLock = null;
  }
}

async function releaseScreenWakeLock(){
  wakeLockWanted = false;
  try{
    if(screenWakeLock && !screenWakeLock.released){
      await screenWakeLock.release();
    }
  }catch(err){}
  screenWakeLock = null;
}

function keepScreenAwake(){
  wakeLockWanted = true;
  requestScreenWakeLock();
}

// Wake Lock يُحرر تلقائيًا عندما تصبح الصفحة غير مرئية،
// لذلك يجب إعادة طلبه عند العودة إذا كان الفيديو ما زال يعمل.
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && wakeLockWanted){
    requestScreenWakeLock();
  }
});

// تحميل سكربت يوتيوب IFrame API
const ytScript = document.createElement("script");
ytScript.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(ytScript);

window.onYouTubeIframeAPIReady = function(){
  ytApiReady = true;
  if(pendingOpen){
    const p = pendingOpen;
    pendingOpen = null;
    createYtPlayer(p.videoId);
  }
};

function createYtPlayer(videoId){
  ytPlayer = new YT.Player("playerFrame", {
    videoId: videoId,
    playerVars: { autoplay: 1, rel: 0 },
    events: {
      onReady: (e) => {
        e.target.setPlaybackQuality(getQualityPref());
        e.target.playVideo();
      },
      onStateChange: (e) => {
        // YouTube: PLAYING=1, BUFFERING=3.
        // نمنع إطفاء الشاشة أثناء التشغيل/التخزين المؤقت فقط.
        if(e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.BUFFERING){
          keepScreenAwake();
        }else{
          releaseScreenWakeLock();
        }
      }
    }
  });
}

function playVideoInPlayer(videoId){
  // ننتظر حالة PLAYING من YouTube قبل تثبيت الشاشة،
  // لكن نترك الطلب جاهزًا بمجرد فتح المشغّل.
  if(!ytApiReady){
    pendingOpen = { videoId };
    return;
  }
  if(!ytPlayer){
    createYtPlayer(videoId);
    return;
  }
  ytPlayer.loadVideoById({ videoId: videoId, suggestedQuality: getQualityPref() });
}

function openPlayer(videoId, title, channel, channelId){
  playerTitle.textContent = title;
  playerChannel.textContent = channel;
  overlay.classList.add("open");
  overlay.scrollTop = 0;

  activeVideoId = videoId;
  activeChannelId = channelId;
  activeTitle = title;

  playVideoInPlayer(videoId);

  // إعادة الأزرار لوضعها الأصلي (ما تحمّل أي شي إلا لو المستخدم ضغط)
  channelSection.style.display = "none";
  similarSection.style.display = "none";
  channelListEl.innerHTML = "";
  similarListEl.innerHTML = "";
  loadChannelBtn.classList.remove("loaded");
  loadChannelBtn.textContent = t("moreFromChannel");
  loadChannelBtn.disabled = false;
  loadSimilarBtn.classList.remove("loaded");
  loadSimilarBtn.textContent = t("similarVideosBtn");
  loadSimilarBtn.disabled = false;

  history.pushState({ leotubeView: "player" }, "");
}

function closePlayerView(){
  if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
  releaseScreenWakeLock();
  overlay.classList.remove("open");
}

closePlayer.addEventListener("click", () => {
  // زر رجوع بالمتصفح/الجوال هو اللي يقفل فعلياً (عبر popstate تحت) —
  // هذا يخلي كل مكان يقفل فيه المشغّل يسلك نفس المسار الموحّد
  if(history.state && history.state.leotubeView === "player"){
    history.back();
  }else{
    closePlayerView();
  }
});

loadChannelBtn.addEventListener("click", () => {
  loadChannelBtn.disabled = true;
  loadChannelBtn.textContent = "جاري التحميل...";
  channelSection.style.display = "block";
  channelListEl.innerHTML = `<div class="related-loading">جاري التحميل...</div>`;
  loadChannelVideos(activeChannelId, activeVideoId);
});

loadSimilarBtn.addEventListener("click", () => {
  loadSimilarBtn.disabled = true;
  loadSimilarBtn.textContent = "جاري التحميل...";
  similarSection.style.display = "block";
  similarListEl.innerHTML = `<div class="related-loading">جاري التحميل...</div>`;
  loadSimilarVideos(activeTitle, activeVideoId);
});

function apiErrorMessage(data){
  const reason = data?.error?.errors?.[0]?.reason;
  if(reason === "quotaExceeded" || reason === "dailyLimitExceeded"){
    return "تجاوزت الحد اليومي المسموح لمفتاح يوتيوب API — جرّب بعد كذا ساعة أو سوّي مفتاح ثاني";
  }
  return data?.error?.message || "تعذر التحميل";
}

async function loadChannelVideos(channelId, excludeId){
  if(!channelId){
    channelListEl.innerHTML = `<div class="related-loading">ما فيه معرّف قناة لهذا الفيديو</div>`;
    loadChannelBtn.textContent = t("moreFromChannel");
    loadChannelBtn.disabled = false;
    return;
  }
  try{
    const url = `${API_BASE}/search?part=snippet&type=video&order=date&maxResults=6&channelId=${channelId}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error){
      channelListEl.innerHTML = `<div class="related-loading">${apiErrorMessage(data)}</div>`;
    }else{
      renderRelatedList(channelListEl, data.items, excludeId, "ما فيه فيديوهات ثانية بهذي القناة");
    }
  }catch(err){
    channelListEl.innerHTML = `<div class="related-loading">تعذر الاتصال، تحقق من الإنترنت</div>`;
  }
  loadChannelBtn.textContent = "✅ " + t("moreFromChannel");
  loadChannelBtn.classList.add("loaded");
}

async function loadSimilarVideos(title, excludeId){
  try{
    const url = `${API_BASE}/search?part=snippet&type=video&maxResults=6&q=${encodeURIComponent(title)}`;
    const res = await fetch(url);
    const data = await res.json();
    if(data.error){
      similarListEl.innerHTML = `<div class="related-loading">${apiErrorMessage(data)}</div>`;
    }else{
      renderRelatedList(similarListEl, data.items, excludeId, "ما فيه فيديوهات مشابهة");
    }
  }catch(err){
    similarListEl.innerHTML = `<div class="related-loading">تعذر الاتصال، تحقق من الإنترنت</div>`;
  }
  loadSimilarBtn.textContent = "✅ " + t("similarVideosBtn");
  loadSimilarBtn.classList.add("loaded");
}

function renderRelatedList(container, items, excludeId, emptyMsg){
  items = (items || []).filter(it => it.id.videoId && it.id.videoId !== excludeId);
  if(items.length === 0){
    container.innerHTML = `<div class="related-loading">${emptyMsg}</div>`;
    return;
  }
  container.innerHTML = "";
  items.slice(0, 6).forEach(item => {
    const vid = item.id.videoId;
    const sn = item.snippet;
    const row = document.createElement("div");
    row.className = "related-row";
    row.innerHTML = `
      <div class="related-thumb"><img loading="lazy" src="${sn.thumbnails.default?.url || sn.thumbnails.medium?.url}" alt=""></div>
      <div class="related-text">
        <div class="rt-title">${escapeHtml(sn.title)}</div>
        <div class="rt-channel">${escapeHtml(sn.channelTitle)}</div>
      </div>`;
    row.addEventListener("click", () => openPlayer(vid, sn.title, sn.channelTitle, sn.channelId));
    container.appendChild(row);
  });
}

/* ============================================================
   لوحة الإعدادات
   ============================================================ */
const settingsOverlay = document.getElementById("settings-overlay");
const settingsBtn = document.getElementById("settingsBtn");
const closeSettings = document.getElementById("closeSettings");
const themeToggle = document.getElementById("themeToggle");
const langToggle = document.getElementById("langToggle");
const qualitySelect = document.getElementById("qualitySelect");
const checkUpdateBtn = document.getElementById("checkUpdateBtn");
const updateStatus = document.getElementById("updateStatus");
const aboutVersion = document.getElementById("aboutVersion");

settingsBtn.addEventListener("click", () => {
  settingsOverlay.classList.add("open");
  history.pushState({ leotubeView: "settings" }, "");
});
function closeSettingsView(){
  settingsOverlay.classList.remove("open");
}
closeSettings.addEventListener("click", () => {
  if(history.state && history.state.leotubeView === "settings"){
    history.back();
  }else{
    closeSettingsView();
  }
});

themeToggle.querySelectorAll("button").forEach(btn => {
  btn.addEventListener("click", () => applyTheme(btn.dataset.value));
});

langToggle.querySelectorAll("button").forEach(btn => {
  btn.addEventListener("click", () => applyLanguage(btn.dataset.value));
});

qualitySelect.addEventListener("change", () => {
  const q = qualitySelect.value;
  setSetting("leotube_quality", q);
  if(ytPlayer && ytPlayer.setPlaybackQuality) ytPlayer.setPlaybackQuality(q);
});

// ⚠️ فحص حقيقي للتحديثات يحتاج ملف نسخة مستضاف برابط ثابت (يصير متاح
// بعد رفع التطبيق فعلياً). حالياً يعرض النسخة الحالية بس بدون مقارنة فعلية.
checkUpdateBtn.addEventListener("click", () => {
  updateStatus.textContent = t("upToDate") + ` (${APP_VERSION})`;
});

function initSettings(){
  aboutVersion.textContent = APP_VERSION;

  const savedTheme = getSetting("leotube_theme", "dark");
  applyTheme(savedTheme);

  const savedQuality = getSetting("leotube_quality", "default");
  qualitySelect.value = savedQuality;

  applyLanguage(currentLang);
}
initSettings();

/* ============================================================
   زر الرجوع بالمتصفح/الجوال — يقفل الشاشة المفتوحة (فيديو/إعدادات)
   بدل ما يطلع من الصفحة كلها
   ============================================================ */
window.addEventListener("popstate", () => {
  if(overlay.classList.contains("open")){
    closePlayerView();
    return;
  }
  if(settingsOverlay.classList.contains("open")){
    closeSettingsView();
    return;
  }
  // ما فيه شي مفتوح — رجوع طبيعي (يطلع من الصفحة فعلاً)
});

/* ============================================================
   تسجيل Service Worker — شرط أساسي عشان يصير تطبيق PWA قابل
   للتثبيت وتحويله لـ APK لاحقاً
   ============================================================ */
if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
